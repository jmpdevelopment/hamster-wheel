# Wails v3 configuration for Hamster Wheel
version: '3'

# Application information
info:
  companyName: "jmpdevelopment"
  productName: "Hamster Wheel"
  productIdentifier: "io.github.jmpdevelopment.hamster-wheel"
  description: "Automated job search monitoring with LLM-powered matching"
  copyright: "(c) 2026, jmpdevelopment"
  comments: "Self-hosted desktop app that polls job boards and scores listings against your CV"
  version: "1.0.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: info
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: npm run dev --prefix frontend
      type: background
    - cmd: ./dev-run.sh
      type: primary
